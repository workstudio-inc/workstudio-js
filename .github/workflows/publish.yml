# ==============================================================================
# Publish @workstudio/integrations to npm
# ==============================================================================
# Triggered by pushing a tag, so a release is a reviewable git object rather than
# whatever happened to be on someone's laptop:
#
#   npm version patch     # or minor / major — commits and tags
#   git push --follow-tags
#
# Requires an NPM_TOKEN secret (an npm automation token with publish rights on
# the @workstudio scope). It is not configured yet; the guard below fails with a
# clear message rather than a confusing 401 from the registry.
#
# Publishing is close to irreversible: npm's unpublish window is 72 hours and the
# name stays burned afterwards. The version check below refuses to republish a
# version that already exists, which is the mistake that is easiest to make.
# ==============================================================================

name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the publish token exists
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm automation token with"
            echo "::error::publish rights on the @workstudio scope as an org or repo secret."
            exit 1
          fi
          echo "Token present."

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # A tag that disagrees with package.json publishes a version nobody expects.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::Tag $TAG != package.json $PKG"; exit 1; }

      - name: Refuse to republish an existing version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VER is already on npm. Bump the version."
            exit 1
          fi
          echo "$NAME@$VER is new."

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "### Published \`$NAME@$VER\`" >> $GITHUB_STEP_SUMMARY
          echo "https://www.npmjs.com/package/$NAME" >> $GITHUB_STEP_SUMMARY
