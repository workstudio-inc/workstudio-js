# ==============================================================================
# Publish @workstudio-inc/sdk to npm
# ==============================================================================
# Triggered by pushing a tag, so a release is a reviewable git object rather than
# whatever happened to be on someone's laptop:
#
#   npm version patch     # or minor / major — commits and tags
#   git push --follow-tags
#
# Authentication prefers npm Trusted Publishing (OIDC): no long-lived token, and
# it sidesteps npm's restriction on 2FA-bypassing tokens (account changes Aug 2026,
# direct publishing Jan 2027). Requires npm CLI >= 11.5.1, which the setup step pins.
#
# Bootstrap caveat: unlike PyPI, npm cannot configure a trusted publisher for a
# package that does not exist yet. So the FIRST publish needs either a one-off
# `npm publish` from a 2FA'd local session, or an NPM_TOKEN. After that, configure
# the trusted publisher at npmjs.com and delete the token.
#
# Publishing is close to irreversible: npm's unpublish window is 72 hours and the
# name stays burned afterwards. The version check below refuses to republish a
# version that already exists, which is the mistake that is easiest to make.
# ==============================================================================

name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # OIDC needs a recent npm; the runner's bundled version may predate it.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # A tag that disagrees with package.json publishes a version nobody expects.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::Tag $TAG != package.json $PKG"; exit 1; }

      - name: Refuse to republish an existing version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VER is already on npm. Bump the version."
            exit 1
          fi
          echo "$NAME@$VER is new."

      # No NODE_AUTH_TOKEN when trusted publishing is configured — npm exchanges the
      # OIDC token itself. The env line stays so the very first (bootstrap) publish
      # can still use a token; it is simply empty once the token is deleted.
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "### Published \`$NAME@$VER\`" >> $GITHUB_STEP_SUMMARY
          echo "https://www.npmjs.com/package/$NAME" >> $GITHUB_STEP_SUMMARY
